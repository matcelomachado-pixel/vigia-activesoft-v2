name: Vigia Assessor.IA Multi-Workers

on:
  schedule:
    # Ajuste para o horário que você já usa (ex: a cada hora)
    - cron: '0/15 * * * *' 
  workflow_dispatch:

jobs:
  vigiar_tarefas:
    runs-on: ubuntu-latest
    
    # LIGANDO OS 3 ROBÔS
    strategy:
      matrix:
        robo_id: [1, 2, 3] 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install gspread oauth2client selenium requests urllib3 pandas

      - name: Criar credenciais.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      # 🔥 RODA O SCAN APENAS NA MÁQUINA 1 (Para não dar conflito)
      - name: Executar o Vigia Scan
        if: matrix.robo_id == 1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python vigia_scan.py

      # 🔥 RODA O DIÁRIO NAS 3 MÁQUINAS AO MESMO TEMPO
      - name: Executar o Vigia Diário
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python vigia_diario.py
