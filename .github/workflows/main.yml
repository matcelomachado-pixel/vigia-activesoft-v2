name: Vigia Central

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  rodar_vigia:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install selenium gspread oauth2client requests urllib3

    - name: Criar arquivo de credenciais
      env:
        GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDS" > credenciais.json

    - name: Rodar o Vigia
      env:
        SENHA_ACTIVESOFT: ${{ secrets.SENHA_ACTIVESOFT }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python vigia_diario.py
