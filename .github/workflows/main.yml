name: Vigia Assessor.IA Multi-Workers

on:
  schedule:
    # Exemplo: Roda de hora em hora. Mantenha o horário que você já usava!
    - cron: '0/15 * * * *' 
  workflow_dispatch: # Permite que você aperte o botão "Run workflow" manualmente

jobs:
  vigiar_tarefas:
    runs-on: ubuntu-latest
    
    # 🔥 A MÁGICA DOS MULTI-WORKERS COMEÇA AQUI 🔥
    strategy:
      matrix:
        # O GitHub vai criar 3 máquinas virtuais simultâneas!
        # Se um dia quiser 5 robôs, é só mudar para: [1, 2, 3, 4, 5]
        robo_id: [1, 2, 3] 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Ou a versão que você já estava usando

      - name: Instalar dependências
        run: |
          pip install gspread oauth2client selenium requests urllib3

      # Gera o arquivo de credenciais do Google a partir do Secret do GitHub
      - name: Criar credenciais.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      # Roda o arquivo Python. Cada um dos 3 robôs vai executar isso ao mesmo tempo!
      - name: Executar o Vigia Diário
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python vigia_diario.py
