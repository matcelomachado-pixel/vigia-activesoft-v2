name: Vigia Assessor.IA Multi-Workers

on:
  schedule:
    # Ajuste para o horário que você já usa (ex: a cada hora)
    - cron: '0/15 * * * *' 
  workflow_dispatch:

jobs:
  vigiar_tarefas:
    runs-on: ubuntu-latest
    
    # LIGANDO OS 3 ROBÔS
    strategy:
      matrix:
        robo_id: [1, 2, 3] 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install gspread oauth2client selenium requests urllib3 pandas cryptography

      - name: Criar credenciais.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      # 🔥 A MÁGICA: Atraso escalonado para não assustar o Google 🔥
      # Robô 1 não espera (0s), Robô 2 espera 20s, Robô 3 espera 40s.
      - name: Anti-Gargalo do Google
        run: sleep $(( (${{ matrix.robo_id }} - 1) * 20 ))

      # RODA O SCAN APENAS NA MÁQUINA 1
      - name: Executar o Vigia Scan
        if: matrix.robo_id == 1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VIGIA_KEY: ${{ secrets.VIGIA_KEY }}
        run: python vigia_scan.py

      # RODA O DIÁRIO
      - name: Executar o Vigia Diário
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          VIGIA_KEY: ${{ secrets.VIGIA_KEY }}
        run: python vigia_diario.py
      
